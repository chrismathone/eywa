name: CI

# 네 게이트 중 Vercel이 안 돌리는 것(typecheck/lint/test+coverage)을 CI로 강제(#Q5).
# build는 Vercel이 push마다 수행하므로 여기선 제외(시크릿 불필요).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # ⚠️ 이 워크플로는 2026-10-21부터 GitHub에서 꺼져 있다(disabled_manually · 결제) — 지금 게이트는 로컬 `pnpm verify`.
    # 잡 전역 힙 4GB는 lint/test용이다. `pnpm typecheck`는 스크립트가 힙을 직접 8GB로 준다(이 값을 덮는다) — 전체 tsc는
    # 6GB에서 메모리 부족으로 죽고 8GB에서 최대 RSS 약 7.5GB(2026-11-10 실측, docs/setup-and-ops.md). 다시 켤 땐 메모리 16GB급 러너로.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # next-env.d.ts는 gitignore + build 산출물(.next/types/routes.d.ts 참조)이라 CI 체크아웃엔 없다.
      # build 없이 typecheck하려면 Next 이미지/모듈 ambient 선언(*.webp 등)이 필요 → 최소본을 생성.
      # (routes.d.ts는 typed-routes용 build 산출물이라 생략 — 타입드 라우트 엄격검사는 Vercel build가 담당.)
      - name: Next ambient 타입 생성 (build 없이 typecheck용)
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test + coverage (계산 모듈 임계값 게이트)
        run: pnpm test:coverage
