name: CI

# 네 게이트 중 Vercel이 안 돌리는 것(typecheck/lint/test+coverage)을 CI로 강제(#Q5).
# build는 Vercel이 push마다 수행하므로 여기선 제외(시크릿 불필요).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # 코드베이스가 커지며 tsc(typecheck)가 러너 기본 힙(~2GB)을 초과해 OOM(exit 134)으로 실패.
    # 잡 전역으로 Node 힙을 4GB로 올려 typecheck/lint/test 전부 안전하게(러너 RAM ~7GB).
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test + coverage (계산 모듈 임계값 게이트)
        run: pnpm test:coverage
