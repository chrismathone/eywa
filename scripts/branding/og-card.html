<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>AYWA 링크 미리보기 원본</title>
  <style>
    @font-face { font-family: Pretendard; src: url('../../public/fonts/PretendardVariable.woff2') format('woff2'); font-weight: 45 920; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: Pretendard, sans-serif; background: #f8f9f5; color: #173f31; }
    main { position: relative; width: 1200px; height: 630px; }
    .copy { position: absolute; inset: 0 auto 0 0; width: 660px; padding: 66px 0 60px 76px; }
    .brand { margin: 0; font-size: 52px; line-height: 1; font-weight: 800; letter-spacing: -2px; }
    h1 { margin: 79px 0 25px; font-size: 68px; line-height: 1.18; font-weight: 740; letter-spacing: -3px; }
    .description { margin: 0; font-size: 27px; line-height: 1.5; font-weight: 460; letter-spacing: -.6px; color: #50675d; }
    .domain { position: absolute; bottom: 55px; margin: 0; font-size: 23px; font-weight: 560; letter-spacing: .1px; color: #50675d; }
    .art { position: absolute; top: 0; right: 0; width: 540px; height: 630px; background: #194c39; display: flex; align-items: center; justify-content: center; }
    .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <main>
    <div class="copy">
      <p class="brand">AYWA</p>
      <h1>학원 운영을<br>한눈에.</h1>
      <p class="description">출결부터 수납, 상담까지.</p>
      <p class="domain">aywa.co.kr</p>
    </div>
    <div class="art"><img src="../../public/eywa-logo.png" alt="AYWA 나뭇잎 로고"></div>
  </main>
</body>
</html>
