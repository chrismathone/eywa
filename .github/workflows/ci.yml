name: CI

# 네 게이트 중 Vercel이 안 돌리는 것(typecheck/lint/test+coverage)을 CI로 강제(#Q5).
# build는 Vercel이 push마다 수행하므로 여기선 제외(시크릿 불필요).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # 사용자 지시: 이 개발 작업은 로컬에서만 검증한다.
    if: ${{ github.head_ref != 'codex/visitor-history-view' && github.head_ref != 'codex/management-agent-mvp' && github.head_ref != 'codex/student-care-mvp' }}
    runs-on: ubuntu-latest
    # 코드베이스가 커지며 tsc(typecheck)가 러너 기본 힙(~2GB)을 초과해 OOM(exit 134)으로 실패.
    # 잡 전역으로 Node 힙을 4GB로 올려 typecheck/lint/test 전부 안전하게(러너 RAM ~7GB).
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # next-env.d.ts는 gitignore + build 산출물(.next/types/routes.d.ts 참조)이라 CI 체크아웃엔 없다.
      # build 없이 typecheck하려면 Next 이미지/모듈 ambient 선언(*.webp 등)이 필요 → 최소본을 생성.
      # (routes.d.ts는 typed-routes용 build 산출물이라 생략 — 타입드 라우트 엄격검사는 Vercel build가 담당.)
      - name: Next ambient 타입 생성 (build 없이 typecheck용)
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test + coverage (계산 모듈 임계값 게이트)
        run: pnpm test:coverage
