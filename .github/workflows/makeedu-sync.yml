name: makeedu-sync

# makeedu(school.makeedu.co.kr) → eywa Supabase **증분 동기화**(additive). 임포터가 멱등이라 매 실행이 증분.
# ⚠️ 자동 cron 비활성(2026-07-01) — makeedu가 세션을 캡처 IP(집)에 묶어 GitHub 데이터센터 IP를 거부 →
#    여기선 신뢰성 있게 안 됨. 자동 동기화는 **로컬 Windows 작업 스케줄러**(scripts/_makeedu/run-local-sync.ps1)로
#    전환했다. 이 워크플로는 수동(workflow_dispatch)만 남긴다(집 신뢰 IP 러너가 생기면 아래 schedule 복구 가능).
#
# ⚠️ 필요한 Secrets — 레포 Settings → Secrets and variables → Actions:
#    · DATABASE_URL          Supabase 세션 풀러 연결 문자열(로컬 .env.local과 동일) — 필수
#    그리고 makeedu 접근은 둘 중 하나:
#    · MAKEEDU_STORAGE_STATE (권장) capture-session.cjs로 캡처한 세션 JSON — 로그인을 건너뜀(CAPTCHA 회피).
#                            `gh secret set MAKEEDU_STORAGE_STATE < D:/tmp/makeedu/session.json`
#    · MAKEEDU_ID + MAKEEDU_PW  (대안) 헤드리스 새 로그인 — ⚠️ makeedu가 낯선 IP/봇 로그인을 CAPTCHA로 막으므로
#                            클라우드 러너에선 보통 실패한다(세션 재사용 권장).
#    · MAKEEDU_STUDENTS_URL  (선택) 재원생 목록 URL이 기본값과 다르면 교정
# ⚠️ 앱에서 학원설정 → 연동의 'makeedu 동기화'를 끄면(user_integrations.sync_enabled=false) cron이 스킵한다.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "동기화 OFF 토글을 무시하고 강제 실행(앱 '지금 동기화' 버튼이 사용)"
        type: boolean
        default: false
  # ⚠️ 자동 스케줄 비활성(2026-07-01) — GitHub 데이터센터 IP는 makeedu 세션이 거부됨(IP 종속).
  #    자동 동기화 = 로컬 작업 스케줄러(run-local-sync.ps1, 06/18 KST). workflow_dispatch(수동)만 유지.
  # schedule:
  #   - cron: "0 21 * * *" # 06:00 KST (UTC+9)
  #   - cron: "0 9 * * *" # 18:00 KST

# 긴 스크래핑이 겹치지 않게 한 번에 하나만.
concurrency:
  group: makeedu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAKEEDU_ID: ${{ secrets.MAKEEDU_ID }}
      MAKEEDU_PW: ${{ secrets.MAKEEDU_PW }}
      MAKEEDU_STORAGE_STATE: ${{ secrets.MAKEEDU_STORAGE_STATE }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAKEEDU_STUDENTS_URL: ${{ secrets.MAKEEDU_STUDENTS_URL }}
      MAKEEDU_FORCE: ${{ inputs.force }}
      MAKEEDU_OUT: ./.makeedu-tmp
    steps:
      - uses: actions/checkout@v4

      - name: Guard — 필수 Secrets 확인
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL Secret이 설정되지 않았습니다 (레포 Settings → Secrets)."
            exit 1
          fi
          if [ -z "$MAKEEDU_STORAGE_STATE" ] && { [ -z "$MAKEEDU_ID" ] || [ -z "$MAKEEDU_PW" ]; }; then
            echo "::error::makeedu 접근 정보가 없습니다 — MAKEEDU_STORAGE_STATE(권장) 또는 MAKEEDU_ID+MAKEEDU_PW 중 하나는 필요합니다."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run makeedu sync (additive)
        run: node scripts/_makeedu/sync-all.cjs --apply
